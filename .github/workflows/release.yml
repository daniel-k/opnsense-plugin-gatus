name: release-packages

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  freebsd:
    runs-on: ubuntu-latest
    name: "FreeBSD ${{ matrix.freebsd }} (OPNsense ${{ matrix.opnsense_abi }})"
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with .github/workflows/build.yml.
        #
        # `freebsd`      FreeBSD release the packages are built on. It has to
        #                match the base of the targeted OPNsense release,
        #                because it determines the pkg ABI.
        # `opnsense_abi` OPNsense release the plugin is annotated for
        #                (`product_abi`). Without it the plugin tooling falls
        #                back to the default in Mk/defaults.mk.
        # `pkg_abi`      Expected pkg ABI, also the published repo directory.
        # `allow_unsupported`
        #                Set when the FreeBSD release is EOL and the ports tree
        #                refuses to build on it. Upgrading the build host is not
        #                an option: pkg on the firewall rejects packages stamped
        #                with a FreeBSD version newer than its own userland.
        #
        # The FreeBSD release per target is not a guess. Every package in
        # OPNsense 26.1 carries FreeBSD_version 1403000 (14.3), and every
        # package in 26.7 carries 1501000 (15.1).
        include:
          - freebsd: "15.1"
            opnsense_abi: "26.7"
            pkg_abi: "FreeBSD:15:amd64"
            allow_unsupported: ""
          - freebsd: "14.3"
            opnsense_abi: "26.1"
            pkg_abi: "FreeBSD:14:amd64"
            allow_unsupported: "yes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          set -eu
          ./scripts/release.sh assert-tag "${{ github.event.release.tag_name }}"

      - name: Prepare cache directories
        run: |
          mkdir -p .ci-cache/distfiles .ci-cache/pkg

      - name: Restore FreeBSD download cache
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/distfiles
            .ci-cache/pkg
          key: freebsd-${{ matrix.freebsd }}-downloads-v2-${{ hashFiles('ports/www/gatus/Makefile', 'ports/www/gatus/distinfo', 'scripts/build-packages.sh') }}
          restore-keys: |
            freebsd-${{ matrix.freebsd }}-downloads-v2-

      - name: Build gatus and os-gatus
        uses: vmactions/freebsd-vm@v1
        with:
          release: "${{ matrix.freebsd }}"
          prepare: |
            set -eux
            mkdir -p "${GITHUB_WORKSPACE}/.ci-cache/distfiles" "${GITHUB_WORKSPACE}/.ci-cache/pkg"

            # FreeBSD's package repo for a branch tracks its newest minor
            # release, which is regularly ahead of the VM image (a 14.4 repo on
            # a 14.3 image), and pkg refuses to use it by default. That only
            # concerns build dependencies fetched here: the packages produced by
            # this job are stamped with the build host's version, which is what
            # the targeted OPNsense release expects.
            #
            # PKG_CACHEDIR points the download cache at the Actions cache
            # without having to replace /var/cache/pkg.
            cat >> /usr/local/etc/pkg.conf <<EOF
            IGNORE_OSVERSION = true;
            PKG_CACHEDIR = "${GITHUB_WORKSPACE}/.ci-cache/pkg";
            EOF

            pkg update -f
            pkg install -y git

            # /usr/ports is a mount point on some images, so replace its
            # contents rather than the directory itself.
            if [ ! -f /usr/ports/Mk/bsd.port.mk ]; then
              mkdir -p /usr/ports
              find /usr/ports -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              git clone --depth 1 https://git.FreeBSD.org/ports.git /usr/ports
            fi
          run: |
            set -eux
            export DISTDIR="${GITHUB_WORKSPACE}/.ci-cache/distfiles"
            export PLUGIN_ABIS="${{ matrix.opnsense_abi }}"
            export EXPECTED_PKG_ABI="${{ matrix.pkg_abi }}"
            # Only exported when non-empty: make treats an empty variable as
            # defined, which would silence the check on supported releases too.
            if [ -n "${{ matrix.allow_unsupported }}" ]; then
              export ALLOW_UNSUPPORTED_SYSTEM="${{ matrix.allow_unsupported }}"
            fi
            ./scripts/build-packages.sh

      - name: Attach gatus packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_ABI: ${{ matrix.pkg_abi }}
        run: |
          set -eu
          TAG="${{ github.event.release.tag_name }}"
          GATUS_PKG="$(find artifacts/All -maxdepth 1 -type f -name 'gatus-*.pkg' | head -n 1)"
          OS_GATUS_PKG="$(find artifacts/All -maxdepth 1 -type f -name 'os-gatus-*.pkg' | head -n 1)"

          if [ -z "${GATUS_PKG}" ] || [ -z "${OS_GATUS_PKG}" ]; then
            echo "error: expected gatus and os-gatus .pkg files in artifacts/All" >&2
            exit 1
          fi

          # One release holds packages for several ABIs, so the asset names have
          # to carry the ABI. GitHub asset names are global per release.
          ABI_SLUG="$(printf '%s' "${PKG_ABI}" | tr ':' '-' | tr '[:upper:]' '[:lower:]')"
          mkdir -p release-assets
          for PKG in "${GATUS_PKG}" "${OS_GATUS_PKG}"; do
            BASE="$(basename "${PKG}" .pkg)"
            cp "${PKG}" "release-assets/${BASE}-${ABI_SLUG}.pkg"
          done

          gh release upload "${TAG}" release-assets/*.pkg --clobber

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-amd64-packages-${{ matrix.freebsd }}
          path: |
            artifacts/All/
            artifacts/ABI
          if-no-files-found: error

  publish-repo:
    name: Publish pkg repo to GitHub Pages
    needs: freebsd
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      # `release` workflows run from tags, so a protected default `github-pages`
      # environment (default-branch-only) rejects the deployment before steps run.
      name: github-pages-release
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: freebsd-amd64-packages-*
          path: pkg-artifacts

      - name: Build Pages content
        run: |
          set -eux

          # Pages deployments replace the whole site, so every supported ABI has
          # to be part of this one deployment.
          ABIS=""
          for DIR in pkg-artifacts/*/; do
            ABI="$(cat "${DIR}ABI")"
            DEST="site/${ABI}"
            mkdir -p "${DEST}"
            cp -a "${DIR}All/." "${DEST}/"
            ABIS="${ABIS} ${ABI}"
          done

          if [ -z "${ABIS}" ]; then
            echo "error: no build artifacts found" >&2
            exit 1
          fi

          ABI_LIST=""
          for ABI in ${ABIS}; do
            ABI_LIST="${ABI_LIST}<li><code>${ABI}</code></li>"
          done

          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>opnsense-plugin-gatus package repository</title>
          </head>
          <body>
            <p>FreeBSD pkg repository for opnsense-plugin-gatus.</p>
            <p>Release tag: ${{ github.event.release.tag_name }}</p>
            <p>Repository URL (<code>\${ABI}</code> is expanded by pkg):</p>
            <pre>https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\${ABI}</pre>
            <p>Published ABIs:</p>
            <ul>${ABI_LIST}</ul>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
