name: build-packages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd:
    runs-on: ubuntu-latest
    name: "FreeBSD ${{ matrix.freebsd }} (OPNsense ${{ matrix.opnsense_abi }})"

    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with .github/workflows/release.yml.
        #
        # `freebsd`      FreeBSD release the packages are built on. It has to
        #                match the base of the targeted OPNsense release,
        #                because it determines the pkg ABI.
        # `opnsense_abi` OPNsense release the plugin is annotated for
        #                (`product_abi`). Without it the plugin tooling falls
        #                back to the default in Mk/defaults.mk.
        # `pkg_abi`      Expected pkg ABI, also the published repo directory.
        include:
          - freebsd: "15.1"
            opnsense_abi: "26.7"
            pkg_abi: "FreeBSD:15:amd64"
          - freebsd: "14.3"
            opnsense_abi: "26.1"
            pkg_abi: "FreeBSD:14:amd64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cache directories
        run: |
          mkdir -p .ci-cache/distfiles .ci-cache/pkg

      - name: Restore FreeBSD download cache
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/distfiles
            .ci-cache/pkg
          key: freebsd-${{ matrix.freebsd }}-downloads-v2-${{ hashFiles('ports/www/gatus/Makefile', 'ports/www/gatus/distinfo', 'scripts/build-packages.sh') }}
          restore-keys: |
            freebsd-${{ matrix.freebsd }}-downloads-v2-

      - name: Build gatus and os-gatus
        uses: vmactions/freebsd-vm@v1
        with:
          release: "${{ matrix.freebsd }}"
          prepare: |
            set -eux
            mkdir -p "${GITHUB_WORKSPACE}/.ci-cache/distfiles" "${GITHUB_WORKSPACE}/.ci-cache/pkg"

            # FreeBSD's package repo for a branch tracks its newest minor
            # release, which is regularly ahead of the VM image (a 14.4 repo on
            # a 14.3 image), and pkg refuses to use it by default. That only
            # concerns build dependencies fetched here: the packages produced by
            # this job are stamped with the build host's version, which is what
            # the targeted OPNsense release expects.
            #
            # PKG_CACHEDIR points the download cache at the Actions cache
            # without having to replace /var/cache/pkg.
            cat >> /usr/local/etc/pkg.conf <<EOF
            IGNORE_OSVERSION = true;
            PKG_CACHEDIR = "${GITHUB_WORKSPACE}/.ci-cache/pkg";
            EOF

            pkg update -f
            pkg install -y git

            # /usr/ports is a mount point on some images, so replace its
            # contents rather than the directory itself.
            if [ ! -f /usr/ports/Mk/bsd.port.mk ]; then
              mkdir -p /usr/ports
              find /usr/ports -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              git clone --depth 1 https://git.FreeBSD.org/ports.git /usr/ports
            fi
          run: |
            set -eux
            export DISTDIR="${GITHUB_WORKSPACE}/.ci-cache/distfiles"
            export PLUGIN_ABIS="${{ matrix.opnsense_abi }}"
            export EXPECTED_PKG_ABI="${{ matrix.pkg_abi }}"
            ./scripts/build-packages.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-amd64-packages-${{ matrix.freebsd }}
          path: |
            artifacts/All/
            artifacts/ABI
          if-no-files-found: error
